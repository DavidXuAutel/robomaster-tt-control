<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2420实验室 · 地图点位核对</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a222c; --ink: #e8eef4; --muted: #8b9aab;
    --line: #2a3644; --accent: #3d9cfd; --ok: #3ecf8e; --charge: #f5c542;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1b2a3a 0%, var(--bg) 55%);
    color: var(--ink); min-height: 100vh;
  }
  header {
    padding: 18px 22px 8px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between;
  }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 650; }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .wrap { display: grid; grid-template-columns: minmax(0,1fr) 340px; min-height: calc(100vh - 74px); }
  @media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } }
  .stage {
    padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .toolbar { width: min(100%, 720px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .chip {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: .85rem; cursor: pointer;
  }
  button.active { border-color: var(--accent); color: var(--accent); }
  .chip { cursor: default; color: var(--muted); }
  .canvas-box {
    position: relative; width: min(100%, 720px); background: #0a0e13;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
  aside {
    border-left: 1px solid var(--line); background: rgba(26,34,44,.92);
    padding: 16px 16px 28px; overflow: auto;
  }
  h2 { font-size: .95rem; margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  .card {
    background: #121820; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .card.recommend { border-color: rgba(62,207,142,.55); }
  .card.avoid { opacity: .75; border-color: rgba(245,197,66,.35); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .tag {
    font-size: .72rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .tag.t01 { color: var(--ok); border-color: rgba(62,207,142,.4); }
  .tag.t08 { color: var(--accent); border-color: rgba(61,156,253,.4); }
  .tag.t03 { color: var(--charge); border-color: rgba(245,197,66,.45); }
  .id { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: var(--muted); word-break: break-all; }
  .plan li { margin: 6px 0; color: var(--muted); font-size: .88rem; line-height: 1.45; }
  .plan strong { color: var(--ink); }
  .warn {
    background: rgba(240,180,41,.08); border: 1px solid rgba(240,180,41,.35);
    color: #f3d48a; border-radius: 10px; padding: 10px 12px; font-size: .85rem; line-height: 1.45;
  }
  .hover {
    position: absolute; left: 12px; bottom: 12px; background: rgba(10,14,19,.88);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: .8rem; color: var(--muted); pointer-events: none; max-width: 92%;
  }
</style>
</head>

let flipY = true, showWall = true, showPlan = true;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hover = document.getElementById('hover');
document.getElementById('subtitle').textContent =
  (DATA.levelName || '') + ' · mapId ' + DATA.mapId + ' · 更新 ' + (DATA.updated || '');
document.getElementById('warnBox').innerHTML = DATA.notes.map(n => '⚠️ ' + n).join('<br/>');
document.getElementById('metaChip').textContent =
  'origin=(' + DATA.origin[0].toFixed(2) + ', ' + DATA.origin[1].toFixed(2) + ')  res=' + DATA.resolution + 'm  ' + DATA.width + '×' + DATA.height + 'px';

function worldToCanvas(x, y) {
  const scale = cv.width / DATA.width;
  let px = (x - DATA.origin[0]) / DATA.resolution;
  let py = (y - DATA.origin[1]) / DATA.resolution;
  if (flipY) py = DATA.height - py;
  return [px * scale, py * scale];
}
function draw() {
  const cssW = Math.min(720, (cv.parentElement.clientWidth || 720));
  const scale = cssW / DATA.width;
  cv.width = DATA.width * scale;
  cv.height = DATA.height * scale;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  if (showWall) {
    ctx.strokeStyle = 'rgba(255,100,100,0.85)';
    ctx.lineWidth = 2;
    for (const g of DATA.walls) {
      if (!g.points || g.points.length < 2) continue;
      ctx.beginPath();
      g.points.forEach((p,i) => {
        const xy = worldToCanvas(+p.x, +p.y);
        if (i===0) ctx.moveTo(xy[0], xy[1]); else ctx.lineTo(xy[0], xy[1]);
      });
      ctx.stroke();
    }
  }
  for (const p of DATA.points) {
    const xy = worldToCanvas(p.x, p.y);
    const x = xy[0], y = xy[1];
    let fill = '#3d9cfd';
    if (p.pointsType === '01') fill = '#3ecf8e';
    if (p.pointsType === '03') fill = '#f5c542';
    if (showPlan && p.planRole === 'recommend') {
      ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(62,207,142,0.9)'; ctx.lineWidth = 3; ctx.stroke();
    }
    if (showPlan && p.planRole === 'avoid') {
      ctx.beginPath();
      ctx.moveTo(x-8,y-8); ctx.lineTo(x+8,y+8);
      ctx.moveTo(x+8,y-8); ctx.lineTo(x-8,y+8);
      ctx.strokeStyle = 'rgba(245,197,66,0.95)'; ctx.lineWidth = 2; ctx.stroke();
    }
    const r = (showPlan && p.planRole === 'recommend') ? 10 : 7;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#0a0e13'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('P'+p.n, x+10, y-8);
  }
}
function renderList() {
  document.getElementById('list').innerHTML = DATA.points.map(p => {
    const role = p.planRole === 'recommend' ? ' · 推荐首测'
      : p.planRole === 'avoid' ? ' · 首测避开'
      : p.planRole === 'alt' ? ' · 备选' : '';
    const cls = p.planRole === 'recommend' ? 'recommend' : (p.planRole === 'avoid' ? 'avoid' : '');
    return '<div class="card '+cls+'"><div class="row"><strong>P'+p.n+' '+p.typeLabel+role+'</strong><span class="tag t'+p.pointsType+'">'+p.pointsType+'</span></div>'
      + '<div style="margin:4px 0;font-size:.88rem">'+p.pointsName+'</div>'
      + '<div class="id">'+p.pointsId+'</div>'
      + '<div style="margin-top:4px;color:var(--muted);font-size:.82rem">x='+p.x.toFixed(2)+' y='+p.y.toFixed(2)+'</div></div>';
  }).join('');
}
cv.addEventListener('mousemove', (ev) => {
  const rect = cv.getBoundingClientRect();
  const mx = (ev.clientX - rect.left) * (cv.width / rect.width);
  const my = (ev.clientY - rect.top) * (cv.height / rect.height);
  let hit = null, best = 14;
  for (const p of DATA.points) {
    const xy = worldToCanvas(p.x, p.y);
    const d = Math.hypot(xy[0]-mx, xy[1]-my);
    if (d < best) { best = d; hit = p; }
  }
  if (hit) {
    hover.textContent = 'P'+hit.n+' '+hit.typeLabel+' | ('+hit.x.toFixed(2)+', '+hit.y.toFixed(2)+') | '+hit.pointsId;
  } else {
    const scale = cv.width / DATA.width;
    let px = mx / scale, py = my / scale;
    if (flipY) py = DATA.height - py;
    const wx = DATA.origin[0] + px * DATA.resolution;
    const wy = DATA.origin[1] + py * DATA.resolution;
    hover.textContent = '地图坐标 ≈ ('+wx.toFixed(2)+', '+wy.toFixed(2)+') m';
  }
});
document.getElementById('btnFlip').onclick = function () {
  flipY = !flipY;
  this.textContent = flipY ? '翻转 Y（当前：图像向下）' : '翻转 Y（当前：未翻转）';
  draw();
};
document.getElementById('btnWall').onclick = function () {
  showWall = !showWall; this.classList.toggle('active', showWall); draw();
};
document.getElementById('btnPlan').onclick = function () {
  showPlan = !showPlan; this.classList.toggle('active', showPlan); draw();
};
img.onload = function () { renderList(); draw(); };
window.addEventListener('resize', draw);
</script>
