# Apex-WAM-Mini v3.2 compatibility registry (multi-profile)
# Profiles: g1 (default) | franka (LIBERO / single-arm sim baseline) | aerial_openfly
# See docs/Apex-WAM-Mini-Franka-Profile.md

default_profile: g1

profiles:
  g1:
    target:
      action_space: eef6d_relative
      embodiment: agibot_g1
      coord_frame: arm_base
      action_dim: 20
      deploy_action_dim: 16
    description: "G1 双臂末端；τ₀-WM 主路径"

  franka:
    target:
      action_space: eef_delta
      embodiment: franka_panda
      coord_frame: libero_world
      action_dim: 7
      deploy_action_dim: 7
    description: "Franka 单臂 LIBERO；7-dim delta eef + gripper；FastWAM 已有 pipeline"

  aerial_openfly:
    target:
      action_space: waypoint_relative
      embodiment: aerial_uav
      coord_frame: body
      action_dim: 4
      deploy_action_dim: 4
    description: "OpenFly aerial VLN; 4D body waypoint; no gripper"

compatible_sources:
  # --- G1 主路径 ---
  - id: target_robot_teleop
    profiles: [g1]
    action_space: eef6d_relative
    embodiment: agibot_g1
    coord_frame: arm_base
    action_dim: 20
    action_supervision: true
    verified: false
    notes: "G1 真机遥操"

  - id: mujoco_g1_proxy
    profiles: [g1]
    action_space: eef6d_relative
    embodiment: agibot_g1
    coord_frame: arm_base
    action_dim: 20
    action_supervision: true
    verified: false
    notes: "MuJoCo G1 仿真；需 eef6d 转换"

  - id: robotwin_g1_proxy
    profiles: [g1]
    action_space: joint_absolute
    embodiment: robotwin_dual_arm
    coord_frame: robot_base
    action_dim: 14
    action_supervision: false
    verified: false
    notes: "RoboTwin joint；G1 档仅 L_video"

  # --- Franka 路径：LIBERO 四套件可监督 L_action ---
  - id: libero_spatial
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false
    notes: "yuanty/LIBERO-fastwam；verify 后可用于 Franka Stage B/C"

  - id: libero_object
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: libero_goal
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: libero_10
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: franka_target_teleop
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false
    notes: "真机 Franka 遥操（可选，与 LIBERO 同 action 合约）"

  - id: libero_90
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: libero_plus
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: libero_lerobot
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: libero_long
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: droid_lerobot
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: droid_world
    action_dim: 7
    action_supervision: true
    verified: false
    notes: "IPEC DROID LeRobot；真机 Franka proxy，需 verify"

  - id: franka_move
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: libero_world
    action_dim: 7
    action_supervision: true
    verified: false

  - id: cmu_franka_exploration
    profiles: [franka]
    action_space: eef_delta
    embodiment: franka_panda
    coord_frame: unknown
    action_dim: 7
    action_supervision: true
    verified: false

  # --- Aerial OpenFly path ---
  - id: openfly_lerobot
    profiles: [aerial_openfly]
    action_space: waypoint_relative
    embodiment: aerial_uav
    coord_frame: body
    action_dim: 4
    action_supervision: true
    verified: false
    notes: "OpenFly → LeRobot pos_delta_v1"

video_only_by_profile:
  g1:
    - libero_spatial
    - libero_object
    - libero_goal
    - libero_10
    - oxe_franka_joint
    - human_ego
    - incompatible_public_robot
  franka:
    - robotwin_g1_proxy
    - oxe_franka_joint
    - human_ego
    - incompatible_public_robot

rules:
  action_supervision: "source in compatible_sources for active profile AND verified AND action_supervision"
  video_supervision: "all sources except blocked"

verification_criteria:
  sample_size: 100
  replay_eef_position_error_mm: 5.0
  replay_eef_rotation_error_deg: 2.0
  coord_frame_consistency_pct: 100.0
  gripper_direction_match_pct: 100.0
  pass_rule: all_thresholds_met
  artifact_dir: reports/registry_verification

  aerial_openfly:
    sample_size: 100
    action_dim: 4
    max_step_translation_m: 15.0
    max_step_yaw_rad: 3.141592653589793
    require_gripper: false
    pass_rule: all_thresholds_met
    artifact_dir: reports/registry_verification/aerial
