# @package _global_

defaults:
  - override /data: aerial_openfly
  - override /model: fastwam_joint
  - _self_

batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false
  loss:
    lambda_video: 1.0
    lambda_action: 1.0

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 1
max_steps: 50
log_every: 5
save_every: 50
eval_every: 50

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
