# @package _global_

defaults:
  - override /data: aerial_openfly_b0_ft_mix
  - override /model: fastwam_joint
  - _self_

batch_size: 1
# WeightedSourceDataset owns a seeded generator. Keep sampling in the main
# process so DataLoader workers cannot clone and correlate its RNG stream.
num_workers: 0

model:
  mot_checkpoint_mixed_attn: true
  loss:
    lambda_video: 0.0
    lambda_action: 1.0

learning_rate: 1.0e-5
lr_scheduler_type: cosine
max_steps: 1000
log_every: 50
save_every: 250
eval_every: 0
warmup_steps: 50
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
seed: 42

source_monitor:
  _target_: experiments.aerial.ft_source_monitor.FTSourceMonitor
  correction_name: correction
  log_every: 50
  window_steps: 200
  min_correction_rate: 0.20
  max_correction_rate: 0.30
  # Warn on a single noisy window; only fail the run on sustained drift.
  max_consecutive_violations: 3
