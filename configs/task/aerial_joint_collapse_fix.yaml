# @package _global_
# Collapse-fix recipe (v3.2 scheme B). Does not alter aerial_joint_1cam_1e-4.
#
# enable_action_cls lives in this task so train AND closed-loop eval both get
# head_cls (eval only passes task=…; without this key it silently falls back to
# continuous nearest-primitive and Task 4 would not measure learned stop).
# Train launcher still passes +model.action_dit_config.enable_action_cls=true
# for self-documenting logs / Hydra struct safety.

defaults:
  - override /data: aerial_openfly_collapse_fix
  - override /model: fastwam_joint
  - _self_

batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false
  action_dit_config:
    enable_action_cls: true
  loss:
    lambda_video: 1.0
    # λ_fm (flow-matching) kept small; CE is the primary action objective.
    lambda_action: 0.1
    lambda_ce: 1.0

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 1
max_steps: 50
log_every: 5
save_every: 50
eval_every: 0

gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
