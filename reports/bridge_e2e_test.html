<!DOCTYPE html>

<head>

    margin: 0;

  dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 20px; margin: 0; }
  dt { color: #8b93a7; font-size: 14px; }
  dd { margin: 0; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    margin-top: 28px;
    padding: 12px 16px;
    border-radius: 8px;
    background: #10331f;

    color: #6ee7a0;
